<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@500;700;900&family=Press+Start+2P&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <title>WAAAGH! Mekboy Companion</title>
    <style>
      html, body { background: #0a0a0a; color: #e8e8ec; margin: 0; min-height: 100vh; font-family: monospace; }
      #boot { padding: 24px; text-align: center; color: #39ff14; font-size: 14px; }
      #boot-err { display: none; padding: 16px; margin: 16px; background: #2a0000; border: 1px solid #ff2d2d; color: #ff8080; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    </style>
  </head>
  <body>
    <div id="boot">⚙ Chargement WAAAGH!…</div>
    <pre id="boot-err"></pre>
    <div id="app"></div>
    <script>
      window.addEventListener('error', (e) => {
        var el = document.getElementById('boot-err');
        if (el) { el.style.display = 'block'; el.textContent = 'ERREUR JS: ' + (e.message || e) + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + ((e.error && e.error.stack) || ''); }
      });
      window.addEventListener('unhandledrejection', (e) => {
        var el = document.getElementById('boot-err');
        if (el) { el.style.display = 'block'; el.textContent = 'PROMESSE REJETÉE: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason) || '?'); }
      });
      setTimeout(() => {
        var app = document.getElementById('app');
        var boot = document.getElementById('boot');
        if (app && app.childNodes.length > 0 && boot) boot.style.display = 'none';
      }, 1500);
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
